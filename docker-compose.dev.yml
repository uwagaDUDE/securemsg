# Dev overrides — applies on top of docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  backend:
    command: >
      uvicorn backend.app.main:socket_app
      --host 0.0.0.0 --port 8111
      --reload
      --proxy-headers --forwarded-allow-ips "*"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////data/messenger.db
      ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:5173
    volumes:
      - ./backend:/app/backend
      - ./run.py:/app/run.py
    healthcheck:
      disable: true

  vite:
    image: node:22-alpine
    command: sh -c "npm install --silent && npm run dev"
    environment:
      VITE_API_PROXY: http://backend:8111
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    ports:
      - "5173:5173"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - vite
